services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: goride
      MYSQL_USER: goride
      MYSQL_PASSWORD: goride_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_local_only --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  api:
    build: ./be
    restart: on-failure
    env_file: ./be/.env.docker
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/index.js"]

volumes:
  mysql_data:
