<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Đặt xe GoRide nhanh chóng chỉ trong 30 giây. Minh bạch giá cước, tài xế xác minh, hỗ trợ hành khách 24/7."
    />
    <meta
      name="keywords"
      content="goride, đặt xe công nghệ, taxi công nghệ, đặt xe online, xe ôm công nghệ, xe 4 chỗ, xe 7 chỗ"
    />

    <!-- Open Graph / Social Media -->
    <meta
      property="og:title"
      content="GoRide - Nền Tảng Đặt Xe Công Nghệ Nhanh Chóng & Minh Bạch"
    />
    <meta
      property="og:description"
      content="Kết nối với tài xế gần nhất trong vài phút. Trải nghiệm dịch vụ di chuyển thông minh và an toàn mỗi ngày."
    />
    <meta property="og:image" content="https://goride.vn/og-image.jpg" />
    <meta property="og:type" content="website" />

    <!-- Title -->
    <title>GoRide - Nền Tảng Đặt Xe Công Nghệ Nhanh Chóng & Minh Bạch</title>

    <!-- Preconnect to speed up external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />

    <!-- Be Vietnam Pro (only weights actually used) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Material Symbols Outlined — fixed axes (opsz=24, wght=400, FILL=0, GRAD=0)
      Pinning axes reduces file size from ~4MB → ~120KB
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
